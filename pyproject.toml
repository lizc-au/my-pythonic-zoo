[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "B", "I", "UP", "N", "PL", "RUF"]
ignore = []

[tool.ruff.lint.mccabe]
max-complexity = 7

[tool.ruff.lint.pylint]
max-args = 5
max-returns = 3
max-statements = 25

[dependency-groups]
runtime = [
    "numpy",
    "pandas",
    "xarray",
    "netcdf4",
]

dev = [
    { include-group = "runtime" },
    "pandas-stubs",
    "pytest",
    "ruff",
    "mypy",
]
