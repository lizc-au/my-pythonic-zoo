[mypy]
# Target Python version matching our environment ecosystem
python_version = 3.12

# Tell Mypy that the project root is the explicit package lookup base
explicit_package_bases = True
namespace_packages = True

# Enforce strict type safety guidelines across the zoo
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = True
check_untyped_defs = True

# Relax strict typing rules for tests
[mypy-tests.*]
disallow_untyped_defs = False
check_untyped_defs = False