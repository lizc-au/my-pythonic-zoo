name: 🎓 Guided Starter Issue
description: Propose or publish a beginner-friendly task with pre-written tests and stubs.
labels: ["guided-starter", "good first issue"]
body:
  - type: markdown
    attributes:
      value: |
        ### 🎓 Guided Starter Issue
        Filling out this issue will automatically generate the stub module and test file in the repository!

  - type: input
    id: source-url
    attributes:
      label: 🔗 Original Question Link (Optional)
      description: URL to the Reddit thread, Discord question, or forum post that inspired this task.
      placeholder: https://www.reddit.com/r/learnpython/comments/...
    validations:
      required: false

  - type: input
    id: stub-path
    attributes:
      label: Stub File Path
      placeholder: database_basics/sqlite_crud.py
    validations:
      required: true

  - type: input
    id: test-path
    attributes:
      label: Test File Path
      placeholder: tests/test_sqlite_crud.py
    validations:
      required: true

  - type: textarea
    id: stub-code
    attributes:
      label: Stub Code
      description: Python code for the stub module (with type hints and `pass` statements).
      render: python
    validations:
      required: true

  - type: textarea
    id: test-code
    attributes:
      label: Test Code
      description: Python unit tests verifying the stub implementation.
      render: python
    validations:
      required: true

  - type: textarea
    id: goal
    attributes:
      label: 🎯 Concept & Instructions
      description: What should the contributor build to make the tests pass?
    validations:
      required: true
