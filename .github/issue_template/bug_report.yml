name: 🐛 Bug Report
description: Report a bug, typo, or unexpected behavior in an exhibit.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report a bug! Please fill out this form to help us reproduce and fix the issue.
        ⚠️ **Reminder:** If you want to fix this bug yourself, please state so in the description below and wait to be officially assigned before writing any code.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: E.g., The phone sanitiser throws an unexpected error when handling leading spaces...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Tell us exactly how to trigger the issue.
      placeholder: |
        1. Import 'sanitize_australian_phone_number'
        2. Pass input string '04 1234 5678'
        3. See error...
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
      placeholder: E.g., The function should strip the internal spaces and return a valid national string.
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Python Version
      description: What version of Python are you running?
      placeholder: E.g., Python 3.10.12
    validations:
      required: false

  - type: checkboxes
    id: checkboxes
    attributes:
      label: Contribution Intent
      options:
        - label: 🙋‍♂️ I have a fix ready and would like to be assigned to this issue!
          required: false
