name: Security, Hygiene, and Policy Guard

on:
  pull_request:
    branches: [ main ]

jobs:
  verify-submission:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # =================================================================
      # NEW POLICY ENFORCEMENT STEPS (Safely Quoted)
      # =================================================================

      - name: 'Policy Step 1: Check for restricted file changes'
        uses: actions/github-script@v7
        with:
          script: |
            const repoOwner = context.repo.owner;
            const repoName = context.repo.repo;
            const prNumber = context.payload.pull_request.number;

            const { data: files } = await github.rest.pulls.listFiles({
              owner: repoOwner,
              repo: repoName,
              pull_number: prNumber
            });

            const containsCoreFile = files.some(file => file.filename === 'tests/test_zoo_core.py' || file.filename === 'test_zoo_core.py');
            
            if (containsCoreFile) {
              await github.rest.issues.createComment({
                owner: repoOwner,
                repo: repoName,
                issue_number: prNumber,
                body: `[!] **Notice for @${context.payload.pull_request.user.login}:**\n\nThis PR touches \`test_zoo_core.py\`. Please ensure these edits are discussed in an open issue first so we can review them together!`
              });
              // Commented out to prevent auto-closing PRs:
              // await github.rest.pulls.update({ owner: repoOwner, repo: repoName, pull_number: prNumber, state: 'closed' });
              // core.setFailed('Unauthorized edits to test_zoo_core.py detected.');
            }

      - name: 'Policy Step 2: Check if PR author is assigned'
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const prAuthor = context.payload.pull_request.user.login;
            const repoOwner = context.repo.owner;
            const repoName = context.repo.repo;
            const prNumber = context.payload.pull_request.number;

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: repoOwner,
              repo: repoName,
              assignee: prAuthor,
              state: 'open'
            });

            if (issues.length === 0) {
              await github.rest.issues.createComment({
                owner: repoOwner,
                repo: repoName,
                issue_number: prNumber,
                body: `[+] **Hi @${prAuthor}, thank you for your contribution!**\n\nWe noticed you aren't assigned to an open issue yet. You're welcome to submit PRs directly, but if this relates to an existing roadmap item, drop a comment on the issue so we can link them up!`
              });
              // Commented out to prevent auto-closing PRs:
              // await github.rest.pulls.update({ owner: repoOwner, repo: repoName, pull_number: prNumber, state: 'closed' });
              // core.setFailed('User is not assigned to an open issue.');
            }

      - name: 'Policy Step 3: Verify accompanying tests are included'
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const prAuthor = context.payload.pull_request.user.login;
            const repoOwner = context.repo.owner;
            const repoName = context.repo.repo;
            const prNumber = context.payload.pull_request.number;

            const { data: files } = await github.rest.pulls.listFiles({
              owner: repoOwner,
              repo: repoName,
              pull_number: prNumber
            });

            const hasSourceCodeChanges = files.some(file => file.filename.endsWith('.py') && !file.filename.startsWith('tests/'));
            const hasTestChanges = files.some(file => file.filename.startsWith('tests/'));

            if (hasSourceCodeChanges && !hasTestChanges) {
              await github.rest.issues.createComment({
                owner: repoOwner,
                repo: repoName,
                issue_number: prNumber,
                body: `[i] **Tip for @${prAuthor}:** We noticed Python source code changes without accompanying files in \`tests/\`. Feel free to add tests as you finalize your branch!`
              });

              // Commented out to allow PR submission before adding tests:
              // await github.rest.pulls.update({ owner: repoOwner, repo: repoName, pull_number: prNumber, state: 'closed' });
              // core.setFailed('Missing test file in tests/ folder.');
            }

      # =================================================================
      # YOUR ORIGINAL SECURITY AND CODE HYGIENE STEPS (Preserved intact)
      # =================================================================

      - name: Set up Python
        if: success()
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Verify Zero Dependency Compliance
        if: success()
        run: |
          if grep -qE "^[^#].+" requirements.txt; then
            echo "ERROR: External dependencies detected in requirements.txt!"
            exit 1
          fi
          echo "SUCCESS: Zero external dependencies confirmed."

      - name: Run Linting and Malicious Pattern Scan
        if: success()
        run: |
          pip install ruff
          ruff check .

      - name: Run Automated Test Suite
        if: success()
        run: |
          python -m unittest discover tests
