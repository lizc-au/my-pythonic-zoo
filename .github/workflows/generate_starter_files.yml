name: Generate Guided Starter Files

on:
  issues:
    types: [opened, labeled]

jobs:
  create-files:
    if: contains(github.event.issue.labels.*.name, 'guided-starter')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Parse Issue Body & Write Files
        id: parse
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body;

            function getSection(heading) {
              const regex = new RegExp(`### ${heading}\\s*\\n\\n([\\s\\S]*?)(?=\\n### |$)`);
              const match = body.match(regex);
              if (!match) return '';
              return match[1].replace(/```python|```/g, '').trim();
            }

            const stubPath = getSection('Stub File Path');
            const testPath = getSection('Test File Path');
            const stubCode = getSection('Stub Code');
            const testCode = getSection('Test Code');
            const sourceUrl = getSection('🔗 Original Question Link (Optional)');

            if (stubPath && stubCode && testPath && testCode) {
              const fs = require('fs');
              const path = require('path');

              fs.mkdirSync(path.dirname(stubPath), { recursive: true });
              fs.mkdirSync(path.dirname(testPath), { recursive: true });

              fs.writeFileSync(stubPath, stubCode + '\n');
              fs.writeFileSync(testPath, testCode + '\n');

              core.setOutput('stub_path', stubPath);
              core.setOutput('test_path', testPath);
              core.setOutput('source_url', sourceUrl);
              core.setOutput('has_files', 'true');
            }

      - name: Create Pull Request
        if: steps.parse.outputs.has_files == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: "auto-starter-issue-${{ github.event.issue.number }}"
          title: "chore: add starter files for issue #${{ github.event.issue.number }}"
          body: "Auto-generated stub and test files for Issue #${{ github.event.issue.number }}."
          commit-message: "chore: auto-generate starter files for issue #${{ github.event.issue.number }}"

      - name: Post Confirmation Comment
        if: steps.parse.outputs.has_files == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = context.payload.issue.number;
            const sourceUrl = '${{ steps.parse.outputs.source_url }}';

            let commentBody = `🚀 **Starter files generated!** A Pull Request has been opened to merge the stub and test files into \`main\`.\n\nOnce merged, contributors can claim this issue!`;

            if (sourceUrl && sourceUrl !== 'None' && sourceUrl.startsWith('http')) {
              commentBody += `\n\n💬 **Original Context / Question:** [View Post](${sourceUrl})`;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: commentBody
            });
